services:
  pocket-tts:
    build: .
    container_name: pocket-tts
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - VOICES_DIR=/app/voices
      - OUTPUT_DIR=/app/fertige_files
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-german_24l}
      - HOST=0.0.0.0
      - PORT=8000
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      # Persistent custom voices storage
      - ./voices:/app/voices
      # Archive of produced audio files and generation logs
      - ./fertige_files:/app/fertige_files
      # Persistent cache for downloaded Hugging Face model weights
      - ${HF_CACHE_DIR:-huggingface_cache}:/root/.cache/huggingface
      - pocket_tts_cache:/root/.cache/pocket_tts
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--voices-dir", "/app/voices"]
    restart: unless-stopped

volumes:
  pocket_tts_cache:
  huggingface_cache:
